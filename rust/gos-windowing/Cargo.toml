[package]
name = "gos-windowing"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sdl3-sys = { version = "=0.6.6", default-features = false, features = [
    "build-from-source-static",
    "no-sdl-audio",
    "no-sdl-gpu",
    "no-sdl-camera",
    "no-sdl-joystick",
    "no-sdl-haptic",
    "no-sdl-hidapi",
    "no-sdl-sensor",
    "no-sdl-power",
] }
thiserror = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
rustix = { version = "1", features = ["event", "fs"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_LibraryLoader"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_UI_Shell"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSURL", "NSNotification", "NSProcessInfo", "NSBundle", "NSGeometry", "NSObject", "NSUserNotification", "NSError", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSAppearance", "NSColor", "NSColorSpace", "NSWorkspace", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSGraphicsContext", "NSAccessibility", "NSAccessibilityProtocols", "NSAccessibilityElement", "NSAccessibilityConstants", "objc2-core-foundation"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "block2"] }
